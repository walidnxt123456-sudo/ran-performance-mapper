<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI to Map | RF Optimizer</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

    <header class="top-bar">
        <div class="logo">RF Optimizer </div>
        <div id="status-badge" class="badge">Disconnected</div>
    </header>

    <main class="app-layout">
	
		
        <aside class="sidebar">

			<section class="control-group">
				<h4>Base - Mobile</h4>
				<div id="cell-hierarchy-tree" class="tree-container" style="font-family: monospace; font-size: 0.85em; max-height: 220px; overflow-y: auto; background: #fafafa; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
					<span style="color: #888;">Chargement de l'arborescence...</span>
				</div>
			</section>

			<section class="control-group">
				<h4>Search Density</h4>
				<div class="input-row">
					<label for="site-limit">Nearest Sites:</label>
					<input type="number" id="site-limit" value="9999" min="1" max="50">
				</div>
				<p class="help-text">Shows the top N sites closest to the red pin.</p>
			</section>
			
			<button id="btn-apply" class="btn-primary" style="width: 100%; margin-top: 20px;">
				Apply Selection To Show nearest Cell
			</button>
			

            <section class="control-group">
                <h4>Map Center</h4>
                <div class="coords">
                    <input type="number" id="lat" value="35.8308" step="0.001">
                    <input type="number" id="lon" value="10.6303" step="0.001">
                </div>
            </section>
            

            <div class="session-info">
                ID: <span id="display-session-id">---</span>
            </div>

			<section class="control-group" id="pm-discovery-section" style="display: none;">
				<h4>Performance Discovery</h4>
				
				<button id="btn-pm-extraction" class="btn-primary" style="width: 100%; margin-top: 10px;">
					Pm Extraction
				</button>
				
				<div id="pm-tree-container" class="pm-tree"></div>
			</section>

			<!-- Section Drive Test Analysis Start -->
			<section class="control-group" id="drive-test-section">
				<h4>Drive Test Analysis</h4>
				
				<button id="btn-dt-scan" class="btn-primary" style="width: 100%; margin-top: 10px;">
					Scan Drive Test
				</button>
				
				<div id="dt-container" style="margin-top: 10px;">
					<select id="dt-file-select" style="width: 100%; padding: 6px; margin-top: 5px; display: none;">
						<option value="">-- Sélectionnez un fichier DT --</option>
					</select>
					
					<div id="dt-config-panel" style="display: none; margin-top: 10px;">
						<div class="input-row" style="display: block;">
							<label style="font-weight: bold; display: block; margin-bottom: 5px;">Métriques de Mesure (Multi-choix) :</label>
							<div id="dt-metrics-container" style="max-height: 150px; overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 6px; border-radius: 4px;">
								<!-- Rempli dynamiquement -->
							</div>
						</div>
						
						<button id="btn-dt-extract" class="btn-primary" style="width: 100%; margin-top: 10px;">
							Afficher / Extraire DT
						</button>
					</div>
				</div>
			</section>
			<!-- Section Drive Test Analysis End -->

        </aside>

		<div id="map-container">
            <div id="map"></div>
        </div>

		<aside class="sidebar-right" id="map-controller-bar">
			<header class="sidebar-header">
				<h4>Map Visualization</h4>
			</header>
			
			<div class="visual-actions" style="padding: 10px; border-bottom: 1px solid #ddd; margin-bottom: 10px;">
				<button id="btn-update-thematic" class="btn-primary" style="width: 48%;">Apply KPI</button>
				<button id="btn-reset-thematic" class="btn-secondary" style="width: 48%;">Reset Map</button>
			</div>
			
			<div id="kpi-visual-controls" class="control-list">
				<p class="placeholder-text">Run extraction to see KPI controls...</p>
			</div>
		</aside>
		


    </main>

	<!-- 1. External Libraries -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<!-- 2. Core Logic & Utilities -->
	<script src="/static/js/api.js"></script>
	<script src="/static/js/map/spatial_utils.js"></script>
	<script src="/static/js/map/map_manager.js"></script>

	<!-- 3. Layer Managers -->
	<script src="/static/js/layers/site_layer.js"></script>
	<script src="/static/js/layers/drive_test_layer.js"></script>
	<script src="/static/js/ui/dt_visual_manager.js"></script>
	<script src="/static/js/ui/kpi_visual_manager.js"></script>

	<!-- 4. UI MANAGERS (Crucial: KPIVisualManager must be first) -->
	<script src="/static/js/ui/pm_ui_controller.js"></script>
	<script src="/static/js/ui/dt_ui_controller.js"></script>
	<script src="/static/js/ui/ui_controller.js"></script>

	<!-- 5. Main Entry Point -->
	<script src="/static/js/main.js"></script>
	
</body>
</html>
